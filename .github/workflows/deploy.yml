name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker me-west1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE="me-west1-docker.pkg.dev/gen-lang-client-0972507273/cloud-run-source-deploy/family-calendar-bot:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy family-calendar-bot \
            --image "$IMAGE" \
            --region me-west1 \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 1 \
            --set-secrets="TELEGRAM_TOKEN=TELEGRAM_TOKEN:latest,TELEGRAM_WEBHOOK_SECRET=TELEGRAM_WEBHOOK_SECRET:latest,ICLOUD_APP_PASSWORD=ICLOUD_APP_PASSWORD:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest" \
            --set-env-vars="TELEGRAM_WEBHOOK_URL=https://family-calendar-bot-217503293554.me-west1.run.app/webhook,TELEGRAM_GROUP_CHAT_ID=-5156592857,TAL_TELEGRAM_ID=8533225353,BEN_TELEGRAM_ID=8507341428,ICLOUD_USER=benariel@gmail.com,ICLOUD_CALENDAR_NAME=Shared Calendar,LOG_LEVEL=INFO,DB_PATH=/data/family_calendar.db" \
            --project gen-lang-client-0972507273 \
            --quiet
