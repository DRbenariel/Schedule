name: Morning Routine

on:
  schedule:
    - cron: '0 4 * * *'    # 04:00 UTC = 07:00 Israel time (IDT, UTC+3)
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

jobs:
  morning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install caldav icalendar "python-telegram-bot>=20.0" pytz

      - name: Run morning job
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          ICLOUD_USER: ${{ secrets.ICLOUD_USER }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          ICLOUD_CALENDAR_NAME: ${{ secrets.ICLOUD_CALENDAR_NAME }}
        run: python morning_job.py
