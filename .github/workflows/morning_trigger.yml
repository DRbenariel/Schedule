name: Morning Routine

on:
  schedule:
    - cron: '0 4 * * *'   # 07:00 IDT (summer, UTC+3)
    - cron: '0 5 * * *'   # 07:00 IST (winter, UTC+2)
  workflow_dispatch:        # allow manual trigger from GitHub UI

env:
  GCP_PROJECT: gen-lang-client-0972507273

jobs:
  morning:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch secrets from Secret Manager
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            TELEGRAM_TOKEN:projects/${{ env.GCP_PROJECT }}/secrets/TELEGRAM_TOKEN/versions/latest
            TELEGRAM_GROUP_CHAT_ID:projects/${{ env.GCP_PROJECT }}/secrets/TELEGRAM_GROUP_CHAT_ID/versions/latest
            ICLOUD_USER:projects/${{ env.GCP_PROJECT }}/secrets/ICLOUD_USER/versions/latest
            ICLOUD_APP_PASSWORD:projects/${{ env.GCP_PROJECT }}/secrets/ICLOUD_APP_PASSWORD/versions/latest
            ICLOUD_CALENDAR_NAME:projects/${{ env.GCP_PROJECT }}/secrets/ICLOUD_CALENDAR_NAME/versions/latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run morning job
        env:
          TELEGRAM_TOKEN: ${{ steps.secrets.outputs.TELEGRAM_TOKEN }}
          TELEGRAM_GROUP_CHAT_ID: ${{ steps.secrets.outputs.TELEGRAM_GROUP_CHAT_ID }}
          ICLOUD_USER: ${{ steps.secrets.outputs.ICLOUD_USER }}
          ICLOUD_APP_PASSWORD: ${{ steps.secrets.outputs.ICLOUD_APP_PASSWORD }}
          ICLOUD_CALENDAR_NAME: ${{ steps.secrets.outputs.ICLOUD_CALENDAR_NAME }}
        run: python morning_job.py
